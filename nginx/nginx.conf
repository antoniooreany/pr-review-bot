# pr-review-bot — nginx reverse proxy with TLS + rate limiting.
#
# Sits in front of PR-Agent (port 3000) and slack-notifier (port 3001).
# Provides:
#   - TLS termination on 443 (certs mounted from host)
#   - Per-service rate limiting
#   - Path-based routing: /agent/* → pr-agent, /slack/* → slack-notifier
#   - Standard reverse-proxy headers
#
# For nginx -t validation: this file uses relative paths inside the nginx/
# directory. The operator must mount certificates and run from that prefix.
#
# Defense in depth: even if this nginx is bypassed, slack-notifier
# still validates X-Gitlab-Token via WEBHOOK_SECRET (see notifier.py).

# Events block (minimal — single worker is enough for webhook traffic).
events {
    worker_connections 1024;
}

http {
    # ── Rate limit zones ─────────────────────────────────────────────────────
    # Per-client IP. 10 requests/second sustained, 20 burst.
    # At hotels-data scale (~10 devs, ~250 MR/month) this is 50x headroom.
    limit_req_zone $binary_remote_addr zone=pr_agent:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=slack:10m   rate=10r/s;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"req_time":$request_time,'
        '"upstream":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Upstream services ────────────────────────────────────────────────────
    upstream pr_agent {
        server pr-agent:3000;
        keepalive 16;
    }

    upstream slack_notifier {
        server slack-notifier:3001;
        keepalive 16;
    }

    # ── Server block ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        # listen 80;  # optional: redirect HTTP→HTTPS

        server_name _;

        # TLS — certificates mounted at well-known paths in the container.
        ssl_certificate     /etc/ssl/certs/pr-review-bot.crt;
        ssl_certificate_key /etc/ssl/private/pr-review-bot.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Common security headers.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Larger client body for webhook payloads (up to 5 MB).
        client_max_body_size 5m;

        # PR-Agent webhook endpoint.
        location /agent/ {
            limit_req zone=pr_agent burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://pr_agent/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Slack-notifier webhook endpoint.
        location /slack/ {
            limit_req zone=slack burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://slack_notifier/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # Health endpoint (no rate limit, no upstream — useful for k8s probes).
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}
