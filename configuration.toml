# pr-review-bot — PR-Agent configuration
# Docs: https://docs.pr-agent.ai/usage-guide/configuration_options/

[config]
# Comments are published automatically on MR events.
publish_output = true

# Verbose logging helps while tuning; flip to false in steady state.
verbosity_level = 1

[config.model]
# MiniMax-M3 (OpenAI-compatible).
model_name = "MiniMax-M3"
temperature = 0.2

[config.git_provider]
# PR-Agent's GitLab integration. Auth is via GITLAB_TOKEN env (api scope).
require_fork_via_webhook = false
handle_push_trigger = true

[config.review]
# Run a review automatically on MR open + update.
review_on_push = true
# Don't auto-improve; that's expensive and noisy. Use /improve explicitly.
auto_improve = false

[github]  # section name is historical in PR-Agent; covers all git providers
# Reserve space for per-provider tuning later.
provider = "gitlab"

# ─── Hotels-data review guidelines (PR-Agent ingests this on /review) ───────
[config.custom_review_guidelines]
# Path is resolved by PR-Agent at runtime from the working directory.
guidelines_path = "./review_guidelines.md"
