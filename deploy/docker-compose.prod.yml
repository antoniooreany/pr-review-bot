# pr-review-bot production docker-compose overrides.
#
# Use via:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Differences from base:
# - No host port binding (all services internal-only, nginx exposes 443)
# - restart: unless-stopped for all services
# - Read-only mounts for configs
# - Named volumes for persistence

services:
  pr-agent:
    restart: unless-stopped
    # No `ports:` — internal-only. Reachable via nginx upstream.
    volumes:
      - ./configuration.toml:/app/configuration.toml:ro
      - ./review_guidelines.md:/app/review_guidelines.md:ro
      - pr-agent-data:/app/data
    environment:
      - PR_AGENT_CONFIG=/app/configuration.toml
      - PR_AGENT_PORT=3000
      - LOG_LEVEL=INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  slack-notifier:
    restart: unless-stopped
    # No `ports:` — internal-only. Reachable via nginx upstream.
    volumes:
      - ./slack-notifier:/app:ro
    environment:
      - PORT=3001
      - LOG_LEVEL=INFO
    # Secrets come from /etc/pr-review-bot/secrets.env (mounted by systemd)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: pr-review-bot-nginx
    restart: unless-stopped
    ports:
      # Only nginx exposes port to the host. pr-agent and slack-notifier
      # are internal-only and reachable via the pr-review-bot-network.
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./nginx/private:/etc/ssl/private:ro
    depends_on:
      - pr-agent
      - slack-notifier
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "https://localhost:443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pr-agent-data:
    name: pr-review-bot-data-prod

networks:
  default:
    name: pr-review-bot-network
